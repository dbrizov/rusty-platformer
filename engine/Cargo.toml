[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
engine_derive = { path = "../engine_derive" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Linux + macOS: use system SDL via pkg-config
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
sdl2 = { version = "0.38.0", features = ["image", "ttf"] }

# Windows: use vcpkg
[target.'cfg(target_os = "windows")'.dependencies]
sdl2 = { version = "0.38.0", features = ["image", "ttf", "use-vcpkg", "static-link"] }

# vcpkg config
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "670f6dddaafc59c5dfe0587a130d59a35c48ea38"
dependencies = ["sdl2", "sdl2-image", "sdl2-ttf"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }
